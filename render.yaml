# Render Blueprint Specification for JECRC Alumni Diwali 2026
# Frontend: Render Static Site
# Backend: Render Web Service (Node.js + Express)
# Database: Neon PostgreSQL

services:
  # 1. Frontend: Render Static Site (React + Vite)
  - type: static
    name: jecrc-alumni-qr
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jecrc-alumni-api.onrender.com/api

  # 2. Backend: Render Web Service (Node.js + Express)
  - type: web
    name: jecrc-alumni-api
    runtime: node
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CLIENT_URL
        value: https://jecrc-alumni-qr.onrender.com
      - key: PUBLIC_APP_URL
        value: https://jecrc-alumni-qr.onrender.com
      - key: APP_BASE_URL
        value: https://jecrc-alumni-qr.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        value: Admin@JECRC2026!
      - key: INITIAL_VOLUNTEER_USERNAME
        value: volunteer1
      - key: INITIAL_VOLUNTEER_PASSWORD
        value: Volunteer@JECRC2026!
