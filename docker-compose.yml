version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jecrc_diwali_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jecrc_diwali_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata_docker:/var/lib/postgresql/data

volumes:
  pgdata_docker:
